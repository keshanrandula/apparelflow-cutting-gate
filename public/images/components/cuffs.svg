<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="16" fill="#F1F5F9"/>
  <!-- Sleeve Cuff Rectangle with rounded tab -->
  <path d="M18 36 L82 36 L82 64 L18 64 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Topstitch Edge -->
  <path d="M22 40 L78 40 L78 60 L22 60 Z" stroke="#475569" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- Buttonhole Mark -->
  <line x1="28" y1="50" x2="36" y2="50" stroke="#0F172A" stroke-width="2"/>
  <circle cx="28" cy="50" r="1.5" fill="#0F172A"/>
  <circle cx="36" cy="50" r="1.5" fill="#0F172A"/>
  <!-- Button Mark on opposite end -->
  <circle cx="70" cy="50" r="3" fill="#94A3B8" stroke="#0F172A" stroke-width="1.5"/>
</svg>

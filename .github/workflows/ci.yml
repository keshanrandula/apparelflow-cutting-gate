name: CI - Automated Test Suite & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: apparelflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:testpassword123@localhost:5432/apparelflow_test"
      DIRECT_URL: "postgresql://postgres:testpassword123@localhost:5432/apparelflow_test"
      JWT_SECRET: "ci-pipeline-test-jwt-secret-key-32charslong"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Schema to Test Database
        run: npx prisma db push --skip-generate

      - name: Seed Test Database
        run: npm run db:seed

      - name: Execute Automated Vitest Test Suite (Unit + Integration)
        run: npm test

      - name: Production Next.js Build Verification
        run: npm run build
